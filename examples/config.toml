# duralumin config — annotated example
# Default path: ~/.config/duralumin/config.toml
# Override:     --config <path>  or  $DURALUMIN_CONFIG

# --- Storage ------------------------------------------------------------------

[storage]
# Base directory — all paths default relative to this.
dir = "/podcasts"

# Optional overrides:
# library_path = "/podcasts/podcasts"         # defaults to {dir}/podcasts
# state_db     = "/podcasts/db/duralumin.db"  # defaults to {dir}/db/duralumin.db


# --- Downloader ---------------------------------------------------------------

[downloader]
# Maximum simultaneous downloads. 2 is safe for home broadband.
concurrent_downloads = 2

# Timeout for a single HTTP attempt, including streaming the body.
# Large files on slow connections may need more than 20m.
attempt_timeout = "20m"

# Total attempts before an episode is quarantined.
max_retries = 3

# Base for the exponential back-off between retries (±25 % jitter applied).
# Retry delays: ~30s, ~60s, ~120s with default settings.
backoff_base = "30s"

# Sent as the HTTP User-Agent header. Be identifiable — feeds may block
# generic agents.
user_agent = "duralumin/0.1 (+https://github.com/yourname/duralumin)"

# Per-download bandwidth cap in bytes per second. 0 = uncapped (default).
# Useful on metered or shared connections. This is a per-download cap, not an
# aggregate: with concurrent_downloads = 2 and max_bytes_per_sec = 500000,
# total throughput is capped at ~1 MB/s.
# Examples: 102400 = 100 KB/s  |  524288 = 512 KB/s  |  1048576 = 1 MB/s
# Note: if rate limiting, ensure attempt_timeout is long enough to complete the
# largest episode at the chosen rate (500 MB at 100 KB/s needs ~87 min).
# max_bytes_per_sec = 0


# --- Defaults -----------------------------------------------------------------

[defaults]
# What happens when no rule matches an episode.
# "skip" (recommended) — opt-in model, only download what you explicitly want.
# "download"           — opt-out model, download everything unless a rule says otherwise.
action_on_no_match = "skip"


# --- Logging ------------------------------------------------------------------

[logging]
# "pretty" — human-readable colored output (good for interactive use / systemd journal)
# "json"   — one JSON object per line (good for log aggregators like Loki)
format = "pretty"

# Standard log levels: error, warn, info, debug, trace
level = "info"


# --- Server -------------------------------------------------------------------
# Omit this block entirely to disable the RSS restream server.
# When present, `dura start` will spin up the server alongside the download
# loop — but only for feeds that have `restream = true`.

# [server]
# Address to listen on. Use 127.0.0.1 behind a reverse proxy, or 0.0.0.0 to
# expose directly (pair with auth_token in that case).
# bind = "127.0.0.1:3000"
#
# Public base URL used to build enclosure URLs in the restreamed RSS feed.
# Podcast apps fetch audio from here, so it must be reachable from the client.
# No trailing slash.
# base_url = "https://podcasts.example.com"
#
# Optional bearer token. If set, every request must supply it via:
#   Authorization: Bearer <token>
#   or ?key=<token>
# auth_token = "changeme"


# --- Rules --------------------------------------------------------------------
# IMPORTANT: use dotted keys (match.kind = ...) for the match sub-table, NOT
# [feeds.rules.match] or [global_rules.match] headers. TOML forbids redefining
# the same sub-table path across multiple array elements, so the header form
# breaks as soon as a feed or global_rules section has more than one rule.

# --- Global dynamic rules -----------------------------------------------------
# Applied across all feeds before per-feed static rules.
# Useful for a sitewide "keep the last 2 weeks" policy.
# Per-feed [[feeds.dynamic]] blocks are evaluated first and take precedence.

# [[global_dynamics]]
# name           = "rolling-2-week-window"
# match.kind     = "duration_ago"
# match.duration = "14d"


# --- Global rules -------------------------------------------------------------
# Applied after per-feed rules. Useful for cross-feed policies.

# Example: skip anything shorter than 5 minutes (likely a trailer or ad)
[[global_rules]]
# A name is required for logging and debugging, but can be anything you like.
name     = "skip-trailers"
# Rules are evaluated in ascending priority order — lower numbers run first.
# Priority 0 has the highest precedence. Use a high number (e.g. 100) for a
# catch-all rule that only fires when nothing more specific matched.
#
# Scope hierarchy (this order is fixed, regardless of priority number):
# 1. Per-feed rules (defined within a [[feeds]] block)
# 2. Global rules (defined in the [[global_rules]] section)
# 3. Feed's default_action (optional per-feed fallback)
# 4. [defaults] action_on_no_match
priority      = 0
# Available actions: "download", "skip", "quarantine"
action        = "skip"
# Available match kinds:
#   title_regex / description_regex — regex pattern (uses `pattern` field)
#   duration_min / duration_max     — episode length (uses `value`, e.g. "30m", "2h")
#   episode_size_max                — file size (uses `value`, e.g. "500 MB")
#   published_before / published_after — date (uses `date`, RFC3339 format)
#   always                          — matches every episode
#
# Regex patterns follow Rust's `regex` crate syntax. Use single-quoted TOML
# strings to avoid double-escaping: pattern = '^\d+:' (not "^\\d+:")
# Inline flags are supported: (?i) case-insensitive, (?m) multi-line, etc.
match.kind    = "duration_max"
match.value   = "5m"

# Example: skip anything over 500 MB (probably a video feed misclassified as audio)
[[global_rules]]
name          = "skip-huge-files"
priority      = 10
action        = "skip"
match.kind    = "episode_size_max"
match.value   = "500 MB"


# --- Feeds --------------------------------------------------------------------
# Each [[feeds]] block is one RSS/Atom feed.
# slug          — filesystem-safe identifier; used in log output. Must be unique.
# display_name  — optional human-readable label shown in CLI output.
#                 Falls back to the RSS feed title, then the slug.
# aliases       — optional list of alternative identifiers accepted by slug-typed
#                 CLI arguments (e.g. `dura feed info <alias>`). Must be globally
#                 unique across all slugs and aliases.
# poll_interval — how often `dura start` re-checks this feed.
#                 Not used when running via cron/systemd timer (use `dura sync` there).
# restream      — expose this feed through the RSS restream server (default: false).
#                 Requires a [server] block. The feed URL becomes:
#                   <base_url>/rss/<slug>

# --- Feed: download everything -------------------------------------------------

[[feeds]]
url           = "https://feeds.example.com/my-favourite-podcast.rss"
slug          = "my-favourite-podcast"
display_name  = "My Favourite Podcast"   # shown in `dura status` and `dura feed list`
aliases       = ["mfp", "favourite"]     # `dura feed info mfp` resolves to this feed
poll_interval = "1h"
restream      = true   # expose via <base_url>/rss/my-favourite-podcast
# restream_only_matched = true   # (default) only Complete, Dynamic, and queued episodes appear
                                 # in the restreamed feed — set false to include all episodes
                                 # and proxy audio for those not yet downloaded

[[feeds.rules]]
name          = "download-all"
priority      = 0
action        = "download"
match.kind    = "always"

# Dynamic windows keep the N most recent (or most recently published) episodes
# downloaded and delete the rest automatically on each sync cycle.
# A dynamic episode's file is kept while it's in the window, then deleted when
# it falls out.  If a static rule also matches the episode (e.g. "download-all"
# above), it gets promoted to a permanent Complete download instead of being purged.
#
# Two kinds:
#   last_n_episodes  — keep the N episodes newest by feed position
#   duration_ago     — keep episodes published within a rolling time window
#
# Only one dynamic rule needs to match for the episode to be kept.
[[feeds.dynamic]]
name           = "keep-10-most-recent"
match.kind     = "last_n_episodes"
match.last_n_episodes = 10

# [[feeds.dynamic]]
# name           = "keep-last-2-weeks"
# match.kind     = "duration_ago"
# match.duration = "14d"


# --- Feed: only recent episodes ------------------------------------------------

[[feeds]]
url           = "https://feeds.example.com/news-briefing.rss"
slug          = "news-briefing"
poll_interval = "30m"

# Only download episodes published after a specific date.
# Useful to avoid backfilling hundreds of old episodes on first run.
[[feeds.rules]]
name          = "only-recent"
priority      = 0
action        = "download"
match.kind    = "published_after"
match.date    = "2024-01-01T00:00:00Z"


# --- Feed: filter by title -----------------------------------------------------

[[feeds]]
url           = "https://feeds.example.com/tech-show.rss"
slug          = "tech-show"
poll_interval = "1h"

# Priority 0: quarantine bonus/promo episodes first so they can't slip through
# as a numbered episode below.
[[feeds.rules]]
name          = "quarantine-bonus"
priority      = 0
action        = "quarantine"
match.kind    = "title_regex"
match.pattern = '(?i)bonus|trailer|promo'

# Priority 5: only reached if the episode wasn't quarantined above.
# Download episodes whose title starts with a series number.
[[feeds.rules]]
name          = "numbered-episodes"
priority      = 5
action        = "download"
match.kind    = "title_regex"
match.pattern = '^\d+[:\.]'   # matches "42: Deep Dive" or "42. Deep Dive"


# --- Feed: disabled -----------------------------------------------------------

[[feeds]]
url     = "https://feeds.example.com/old-show.rss"
slug    = "old-show"
enabled = false   # excluded from `dura sync` and `dura start` until re-enabled
# no per-feed rules — global rules still apply when re-enabled
