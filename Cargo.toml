[workspace]
members = [
    "crates/core",
    "crates/feed",
    "crates/rules",
    "crates/downloader",
    "crates/metadata",
    "crates/storage",
    "crates/server",
    "crates/transcode",
    "bin/duralumin-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"

[workspace.dependencies]
duralumin-core       = { path = "crates/core" }
duralumin-feed       = { path = "crates/feed" }
duralumin-rules      = { path = "crates/rules" }
duralumin-downloader = { path = "crates/downloader" }
duralumin-metadata   = { path = "crates/metadata" }
duralumin-storage    = { path = "crates/storage" }
duralumin-transcode  = { path = "crates/transcode" }
duralumin-server     = { path = "crates/server" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }

# RSS parsing
feed-rs = "2"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls", "migrate", "chrono"] }

# CLI
clap          = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Audio tags
lofty = "0.24"

# Utilities
regex     = "1"
chrono    = { version = "0.4", features = ["serde"] }
sha2      = "0.11"
hex       = "0.4"
url       = { version = "2", features = ["serde"] }
bytesize  = { version = "2", features = ["serde"] }
humantime = "2"
rustls    = { version = "0.23", features = ["ring"], default-features = false }
anyhow    = "1"
thiserror = "2"

# HTTP server
axum       = "0.8"
tower      = "0.5"
tower-http = { version = "0.6", features = ["fs"] }

# CLI output
comfy-table = "7"
owo-colors  = "4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
