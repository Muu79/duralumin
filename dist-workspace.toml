[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  # Windows
  "x86_64-pc-windows-msvc",
  "i686-pc-windows-msvc",
  # Linux glibc (requires glibc ≥ 2.35 on the host)
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "armv7-unknown-linux-gnueabihf",
  "i686-unknown-linux-gnu",
  # Linux musl — fully static, no glibc needed; best for NAS, containers, old distros
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# The updater only supports tier-1 targets; disabled to avoid build failures
# on armv7, i686, and musl targets.
install-updater = false

# Build 32-bit Windows natively so MSVC's i686 toolchain handles SSE2 correctly.
# Cross-compiling i686-windows from Linux via xwin/clang-cl can't satisfy
# aws-lc-sys's __SSE2__ preprocessor requirement.
[dist.github-custom-runners]
i686-pc-windows-msvc = "windows-2022"

