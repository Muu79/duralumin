[package]
name = "duralumin-cli"
version.workspace = true
edition.workspace = true
description = "Podcast download daemon — sync, archive, and restream your feeds"
license = "MIT"
repository = "https://github.com/muu79/duralumin"
authors = ["muu <email@muaazbhyat.co.za>"]
readme = "../../README.md"
keywords = ["podcast", "rss", "downloader", "restream", "daemon", "sync", "archive"]
categories = ["command-line-utilities", "network-programming", "asynchronous", "audio", "serverless"]

[[bin]]
name = "dura"
path = "src/main.rs"

[package.metadata.deb]
name = "dura"
section = "net"
priority = "optional"
maintainer = "muu <email@muaazbhyat.co.za>"
maintainer-scripts = "../../contrib/deb-scripts"
assets = [
  ["target/release/dura",                  "usr/bin/dura",                                "755"],
  ["../../contrib/dura.service",           "lib/systemd/system/dura.service",             "644"],
  ["../../contrib/config.toml.debian",     "usr/share/doc/dura/config.toml.debian",       "644"],
  ["../../examples/config.toml",           "usr/share/doc/dura/config.toml.example",      "644"],
  ["../../README.md",                      "usr/share/doc/dura/README.md",                "644"],
]

[package.metadata.wix]
upgrade-guid = "584137F1-636D-48FE-9A30-62FC53BF3ADA"
path-guid = "2A9E784D-D978-472C-B6E0-1667CCCB2193"
license = true
eula = false

[dependencies]
duralumin-core       = { workspace = true }
duralumin-feed       = { workspace = true }
duralumin-rules      = { workspace = true }
duralumin-downloader = { workspace = true }
duralumin-metadata   = { workspace = true }
duralumin-storage    = { workspace = true }
duralumin-server     = { workspace = true }
clap               = { workspace = true }
clap_complete      = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
toml               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
humantime          = { workspace = true }
thiserror          = { workspace = true }
chrono             = { workspace = true }
reqwest            = { workspace = true }
rustls             = { workspace = true }
anyhow             = { workspace = true }
url                = { workspace = true }
comfy-table        = { workspace = true }
owo-colors         = { workspace = true }
ratatui            = { workspace = true }
crossterm          = { workspace = true }
arboard            = { workspace = true }
